<style>
/* Layout: compact shop header, search + category chips, responsive card grid (3:4 photo tiles), lightbox overlay */
:root{
  --bg:#0f121a; --surface:#171b26; --surface-2:#1d2230; --ink:#e7e9f0; --muted:#98a0b4; --line:#2a3041;
  --accent:#8299ff; --accent-ink:#0f121a; --gold:#f0c43a; --gold-soft:#3a3115; --gold-ink:#f6dd8e; --red:#e5544b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
  --f-display:"Unbounded",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:28px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--bg))}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:72px;height:72px;border-radius:50%;flex:none;display:block;box-shadow:0 2px 10px rgba(0,0,0,.35)}
@media (max-width:520px){.logo{width:56px;height:56px}}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4vw,32px);letter-spacing:-.01em;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:10px 0 0;max-width:62ch}
.lead b{color:var(--ink);font-weight:600}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.contact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cbtn{display:inline-flex;flex-direction:column;gap:1px;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);border-left:4px solid var(--c);min-width:0}
.cbtn span{font-weight:500;font-size:12px;color:var(--muted)}
.cbtn:hover{border-color:var(--c)}
.cbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cbtn.aukro{--c:#f0c43a}.cbtn.vinted{--c:#2fbfa8}.cbtn.fb{--c:#8299ff}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.tag b{color:var(--ink)}
main{padding-block:18px 56px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1 1 260px;position:relative;min-width:0}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-family:var(--f-mono);font-weight:400;opacity:.75;margin-left:4px}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0;text-align:left;padding:0;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card:hover{transform:translateY(-2px)}}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.nophoto{cursor:default}
.cell{display:flex;flex-direction:column;gap:6px;min-width:0}
.cell>.card{flex:1}
.auk{display:block;text-align:center;font-size:13px;font-weight:700;padding:7px 10px;border-radius:9px;background:#f06a1d;color:#fff;text-decoration:none}
.auk:hover{filter:brightness(1.08)}
.auk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.onauk{position:absolute;left:8px;bottom:8px;background:#f06a1d;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}
.btn.aukbtn{background:#f06a1d;border-color:#f06a1d;color:#fff;text-decoration:none;display:inline-flex;align-items:center}
.ph{aspect-ratio:3/4;background:var(--surface-2);display:grid;place-items:center;position:relative;max-width:100%;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .none{color:var(--muted);font-size:12px;text-align:center;display:grid;gap:8px;justify-items:center;padding:12px}
.ph .none i{width:44px;height:60px;border:2px dashed var(--line);border-radius:6px;display:block}
.qty{position:absolute;right:8px;top:8px;background:rgba(15,18,26,.82);color:var(--ink);font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
.body{padding:10px 12px 12px;display:grid;gap:3px;min-width:0}
.nm{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.sub{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.id{font-family:var(--f-mono);color:var(--gold-ink)}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:500;margin-bottom:6px}
footer{border-top:1px solid var(--line);padding-block:20px 32px;color:var(--muted);font-size:13px}
/* lightbox */
.lb{position:fixed;inset:0;z-index:20;background:rgba(8,10,15,.92);display:grid;grid-template-rows:auto 1fr auto;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lb-title{font-weight:600;min-width:0}
.lb-title .id{margin-right:8px}
.lb-img{display:grid;place-items:center;min-height:0;padding-block:10px}
.lb-img{overflow:hidden}
.lb-img img{max-width:100%;max-height:calc(100vh - 190px);max-height:calc(100dvh - 190px);object-fit:contain;border-radius:8px}
.lb-nav{display:flex;justify-content:center;gap:10px}
.lb-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.card.flash{outline:3px solid var(--gold);outline-offset:3px}
.lb{grid-template-rows:auto auto 1fr auto}
.sides{display:flex;justify-content:center;gap:6px;padding-top:10px}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:999px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.two{position:absolute;left:8px;top:8px;background:rgba(15,18,26,.82);color:var(--ink);font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:default}
</style>

</head>

const UPDATED = '22. 11. 2026';
const CATS = [['all','Vše'],['aukro','Na Aukru'],['card','Karty'],['sealed','Sealed promo'],['jumbo','Jumbo'],['mag','Časopisy'],['box','Boxy a bundly'],['graded','Gradované'],['sticker','Samolepky'],['funko','Funko POP']];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const ks = n => n + ' ks';
const SHOP_URL = 'https://ticd712-gif.github.io/Inventory/';
const slug = i => i.i.replace(/#/g,'h');
const TH = /github\.io$/.test(location.hostname) ? '-t' : '';
function copyText(t, btn){
  const done = () => { const o = btn.textContent; btn.textContent = 'Zkopírováno'; setTimeout(()=>btn.textContent=o, 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, ()=>fallback());
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} ta.remove(); }
}
let cat = 'all', shown = [];
const pieces = ITEMS.reduce((a,i)=>a+i.k,0);
$('#meta').innerHTML = `<span class="tag"><b>${ITEMS.length}</b> položek</span><span class="tag"><b>${pieces.toLocaleString('cs-CZ')}</b> kusů</span><span class="tag">Aktualizováno ${esc(UPDATED)}</span>`;
$('#foot').textContent = `Nabídka platí ke dni ${UPDATED}. Co se mezitím prodalo, už nemusí být k mání. Napiš mi na Aukru, Vintedu nebo Facebooku a ověřím to.`;
function render(){
  const t = norm($('#q').value.trim());
  $('#chips').innerHTML = CATS.map(([k,l])=>{ const n = k==='all' ? ITEMS.length : k==='aukro' ? ITEMS.filter(i=>i.a).length : ITEMS.filter(i=>i.c===k).length; return n ? `<button class="chip" data-c="${k}" aria-pressed="${cat===k}">${l}<span class="n">${n}</span></button>` : ''; }).join('');
  shown = ITEMS.filter(i => (cat==='all' || i.c===cat || (cat==='aukro' && i.a)) && (!t || norm(i.n).includes(t) || norm(i.i).includes(t)));
  $('#grid').innerHTML = shown.length ? shown.map((i,k)=>`<div class="cell">
    <${i.p?'button type="button"':'div'} id="${slug(i)}" class="card${i.p?'':' nophoto'}" ${i.p?`data-k="${k}" aria-label="Zobrazit fotku: ${esc(i.n)}"`:''}>
      <div class="ph">${i.p ? `<img src="img/${i.p}${TH}.jpg" alt="${esc(i.n)}" loading="lazy" width="315" height="420">` : '<div class="none"><i></i>Fotka bude brzy přidána</div>'}${i.k>1?`<span class="qty">${ks(i.k)}</span>`:''}${i.b?'<span class="two">obě strany</span>':''}${i.a?'<span class="onauk">Aukce</span>':''}</div>
      <div class="body"><div class="nm">${esc(i.n)}</div><div class="sub"><span class="id">${esc(i.i)}</span><span>${ks(i.k)}</span></div></div>
    </${i.p?'button':'div'}>${i.a?`<a class="auk" href="${esc(i.a)}" target="_blank" rel="noopener">Přihodit na Aukru ↗</a>`:''}</div>`).join('') : '<div class="empty" style="grid-column:1/-1"><b>Nic nenalezeno</b>Zkus jiný název nebo kategorii.</div>';
}
$('#q').addEventListener('input', render);
$('#chips').addEventListener('click', e=>{ const b=e.target.closest('[data-c]'); if(b){ cat=b.dataset.c; render(); } });
/* lightbox over the photographed items currently shown */
let lbList = [], lbIdx = 0, lbSide = 'f', lastFocus = null;
function lbShow(){
  const i = lbList[lbIdx];
  $('#lb-root').innerHTML = `<div class="lb" role="dialog" aria-modal="true" aria-label="${esc(i.n)}">
    <div class="lb-top"><div class="lb-title"><span class="id">${esc(i.i)}</span>${esc(i.n)} · ${ks(i.k)}</div><div class="lb-acts">${i.a?`<a class="btn aukbtn" href="${esc(i.a)}" target="_blank" rel="noopener">Na Aukru ↗</a>`:''}<button class="btn" data-lb="link" type="button" title="Zkopírovat odkaz na tuhle kartu">Kopírovat odkaz</button><button class="btn" data-lb="close" type="button">Zavřít</button></div></div>
    ${i.b?`<div class="sides" role="group" aria-label="Strana"><button type="button" class="btn sm" data-side="f" aria-pressed="${lbSide==='f'}">Přední strana</button><button type="button" class="btn sm" data-side="b" aria-pressed="${lbSide==='b'}">Zadní strana</button></div>`:''}
    <div class="lb-img"><img src="img/${i.p}${i.b&&lbSide==='b'?'-b':''}.jpg" alt="${esc(i.n)} – ${i.b&&lbSide==='b'?'zadní':'přední'} strana"></div>
    <div class="lb-nav"><button class="btn" data-lb="prev" type="button" ${lbIdx===0?'disabled':''}>‹ Předchozí</button><span style="align-self:center;color:var(--muted);font-size:13px">${lbIdx+1} / ${lbList.length}</span><button class="btn" data-lb="next" type="button" ${lbIdx===lbList.length-1?'disabled':''}>Další ›</button></div>
  </div>`;
  $('#lb-root .lb [data-lb="close"]').focus();
}
function lbClose(){ $('#lb-root').innerHTML=''; if (lastFocus) lastFocus.focus(); try{ if (location.hash) history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
$('#grid').addEventListener('click', e=>{
  const c = e.target.closest('[data-k]'); if (!c) return;
  lastFocus = c; const it = shown[+c.dataset.k];
  lbList = shown.filter(i=>i.p); lbIdx = lbList.indexOf(it); lbSide = 'f'; lbShow();
});
$('#lb-root').addEventListener('click', e=>{
  const sd = e.target.closest('[data-side]'); if (sd){ lbSide = sd.dataset.side; lbShow(); return; }
  const b = e.target.closest('[data-lb]');
  if (b){ const a=b.dataset.lb; if (a==='link'){ copyText(SHOP_URL+'#'+slug(lbList[lbIdx]), b); return; } if (a==='close') lbClose(); else if (a==='prev' && lbIdx>0){ lbIdx--; lbShow(); } else if (a==='next' && lbIdx<lbList.length-1){ lbIdx++; lbShow(); } return; }
  if (e.target.classList.contains('lb') || e.target.classList.contains('lb-img')) lbClose();
});
document.addEventListener('keydown', e=>{
  if (!$('#lb-root').innerHTML) return;
  if (e.key==='Escape') lbClose();
  else if ((e.key==='f'||e.key==='F'||e.key===' ') && lbList[lbIdx] && lbList[lbIdx].b){ e.preventDefault(); lbSide = lbSide==='f'?'b':'f'; lbShow(); }
  else if (e.key==='ArrowLeft' && lbIdx>0){ lbIdx--; lbShow(); }
  else if (e.key==='ArrowRight' && lbIdx<lbList.length-1){ lbIdx++; lbShow(); }
});
render();
/* open the card named in the link, e.g. …/Inventory/#h185 */
function openFromHash(){
  const h = decodeURIComponent((location.hash||'').slice(1)); if (!h) return;
  const it = ITEMS.find(i=>slug(i)===h); if (!it) return;
  cat = 'all'; $('#q').value = ''; render();
  const el = document.getElementById(h); if (!el) return;
  el.scrollIntoView({block:'center'});
  if (it.p){ lastFocus = el; lbList = shown.filter(i=>i.p); lbIdx = lbList.indexOf(it); lbSide = 'f'; lbShow(); }
  else { el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 2400); }
}
openFromHash(); window.addEventListener('hashchange', openFromHash);
})();
</script>
